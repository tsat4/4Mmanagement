# ══ ประตูทางเข้าเดียวของระบบ ESM บน INET (แทน Envoy/Kong ของ Supabase self-host) ══
# เส้นทางลอกจาก supabase/docker/volumes/api/envoy/lds.template.yaml (20/11/2026)
# หน้าเว็บ + API อยู่ลิงก์เดียวกัน ⇒ ไม่มีปัญหา CORS · ไม่ต้องเปิดพอร์ตอื่นออกนอกรั้ว
#
# ⚠️ ต่างจาก Supabase ตัวจริง: ไม่ตรวจหัว `apikey` ที่ประตู — บริการข้างในตรวจ JWT เองทุกตัว
#    (ไม่มี JWT = สิทธิ์ anon เท่ากับคนที่ถือ anon key ซึ่งอยู่ในหน้าเว็บสาธารณะอยู่แล้ว)
# 🔴 OpenShift รันด้วย UID สุ่ม ⇒ พอร์ต 8080 · ห้ามใช้ path ที่ต้องเป็น root
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ชื่อบริการเปลี่ยนได้ผ่าน env ตอนเริ่ม (envsubst ของ image nginx) — ค่าเริ่มต้นตรงกับ Service ใน OpenShift
upstream auth      { server ${AUTH_HOST}:9999; }
upstream rest      { server ${REST_HOST}:3000; }
upstream realtime  { server ${REALTIME_HOST}:4000; }
upstream storage   { server ${STORAGE_HOST}:5000; }
upstream functions { server ${FUNCTIONS_HOST}:9000; }
upstream web       { server ${WEB_HOST}:8080; }

server {
  listen 8080;
  server_name _;
  client_max_body_size 50m;          # เท่ากับ FILE_SIZE_LIMIT ของ storage
  proxy_http_version 1.1;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 300s;

  location = /gw-health { access_log off; return 200 "ok\n"; }

  location /auth/v1/      { proxy_set_header Host $host; proxy_pass http://auth/; }
  location /rest/v1/      { proxy_set_header Host $host; proxy_pass http://rest/; }
  location /graphql/v1    { proxy_set_header Host $host; proxy_pass http://rest/rpc/graphql; }
  location /storage/v1/   { proxy_set_header Host $host; proxy_set_header X-Forwarded-Prefix /storage/v1; proxy_pass http://storage/; }
  location /functions/v1/ { proxy_set_header Host $host; proxy_pass http://functions/; }

  # realtime ดู tenant จาก Host ⇒ ต้องเป็น "realtime-dev.<อะไรก็ได้>" (tenant ที่ SEED_SELF_HOST สร้าง)
  location /realtime/v1/api/ {
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_pass http://realtime/api/;
  }
  location /realtime/v1/ {
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1d;
    proxy_pass http://realtime/socket/;
  }

  # ที่เหลือ = หน้าเว็บ ESM (container ของ Dockerfile ที่รากรีโป)
  location / { proxy_set_header Host $host; proxy_pass http://web; }
}
