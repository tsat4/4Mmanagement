# ══ ความลับของระบบ ESM บน INET — กรอกแล้ววางที่ ⊕ → Import YAML (ห้ามแปะแชท ห้าม commit ไฟล์ที่กรอกแล้ว) ══
# ค่าทั้งหมดมาจาก `node inet/stack/gen-keys.mjs` (ชุดเดียวกับไฟล์ .env บน VM ฐานข้อมูล — ต้องตรงกัน)
apiVersion: v1
kind: Secret
metadata:
  name: esm-stack
type: Opaque
stringData:
  POSTGRES_PASSWORD: "ใส่ค่า"
  JWT_SECRET: "ใส่ค่า"
  ANON_KEY: "ใส่ค่า"
  SERVICE_ROLE_KEY: "ใส่ค่า"
  SECRET_KEY_BASE: "ใส่ค่า"
  RELEASE_COOKIE: "ใส่ค่า"
  REALTIME_DB_ENC_KEY: "ใส่ค่า"
---
# ความลับของ edge functions (ค่าเดียวกับที่ตั้งไว้บน Supabase cloud — ดูใน Dashboard → Edge Functions → Secrets)
# ไม่ใส่ = ฟังก์ชันที่ใช้ค่านั้นทำงานไม่ได้ (เช่น ไม่มี TELEGRAM_BOT_TOKEN = ไม่ส่ง Telegram) แต่ระบบหลักไม่ล่ม
apiVersion: v1
kind: Secret
metadata:
  name: esm-functions
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  TELEGRAM_WEBHOOK_SECRET: ""
  INGEST_SECRET: ""
  CRON_SECRET: ""
  CLEANUP_TOKEN: ""
  ANTHROPIC_API_KEY: ""
  AI_INTAKE_CHAT_IDS: ""
