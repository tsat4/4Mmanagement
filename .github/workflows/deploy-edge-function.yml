# Deploy Supabase Edge Function จากไฟล์ในรีโป (ตรงอักขระ)
#
# ทำไมต้องมี: AI deploy edge function ผ่าน MCP ได้ แต่ต้อง "ส่งเนื้อไฟล์ทั้งก้อน"
#   ไฟล์ใหญ่ (send-notification = 62 KB / 920 บรรทัด) = เสี่ยงคลาดอักขระเงียบๆ
#   ไฟล์นี้คุมแจ้งเตือนทั้งโรงงาน พลาด 1 ตัวอักษร = แจ้งเตือนหยุดทั้งระบบ
#   ⇒ ให้ CI deploy จาก git ที่เป็นแหล่งจริง ไม่ผ่านการพิมพ์ซ้ำ
#
# ต้องตั้ง secret ก่อนใช้ (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — ออกที่ https://supabase.com/dashboard/account/tokens
#   (ไม่ตั้ง = workflow เตือนแล้วข้าม ไม่ทำ CI ล่ม — pattern เดียวกับ acct-import.yml)
#
# 🔴 verify_jwt: ของจริงฝั่ง live เป็น false ทุกตัว (ตัวเรียกส่ง anon key ไม่ใช่ JWT ผู้ใช้)
#    ⇒ default ของ workflow นี้คือ --no-verify-jwt · เปลี่ยนเป็น true = ทุก call ตอบ 401 เงียบๆ
#
# 🕗 ไม่ผูกกับ push โดยตั้งใจ — กดเองเมื่อพร้อม (edge function ไม่สลับบันเดิลหน้าเว็บ
#    แท็บที่เปิดค้างไม่กระทบ แต่ก็ควรเลือกจังหวะเอง)
#
# 📄 docs/modules/edge-functions.md

name: Deploy edge function

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'ชื่อ function ในโฟลเดอร์ supabase/functions/'
        required: true
        default: send-notification
      project:
        description: 'ลงฝั่งไหน'
        required: true
        default: main
        type: choice
        options: [main, dr]
      verify_jwt:
        description: 'บังคับ JWT? (ของเดิมทุกตัวเป็น false — อย่าเปลี่ยนถ้าไม่รู้ว่าทำอะไร)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: เช็คว่ามีโฟลเดอร์ function จริง
        run: |
          set -euo pipefail
          DIR="supabase/functions/${{ inputs.function_name }}"
          if [ ! -f "$DIR/index.ts" ]; then
            echo "::error::ไม่พบ $DIR/index.ts — ตรวจชื่อ function"
            exit 1
          fi
          echo "sha256 ของไฟล์ที่จะ deploy (เอาไปเทียบหลัง deploy ได้):"
          sha256sum "$DIR/index.ts"
          wc -lc "$DIR/index.ts"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::ยังไม่ได้ตั้ง secret SUPABASE_ACCESS_TOKEN — ข้ามรอบนี้"
            exit 0
          fi
          if [ "${{ inputs.project }}" = "dr" ]; then
            REF=eyhclzkifitbhbljgoav   # "Product DB"
          else
            REF=ewhdfqwfwofivojtsizn   # "MAIN"
          fi
          # 🔴 ไม่ใส่ --no-verify-jwt = CLI ตั้ง verify_jwt=true = ทุก call ตอบ 401
          FLAG=--no-verify-jwt
          [ "${{ inputs.verify_jwt }}" = "true" ] && FLAG=""
          supabase functions deploy "${{ inputs.function_name }}" \
            --project-ref "$REF" ${FLAG}

      - name: วิธีตรวจกลับ
        run: |
          echo "เทียบ sha256 ของไฟล์ข้างบน กับเนื้อไฟล์ที่ live ตอบกลับมา"
          echo "ถ้าไม่ตรง = deploy ไม่สมบูรณ์ ให้กดซ้ำ ห้ามปล่อยไว้"
